services:
  postgres:
    image: postgres:16
    container_name: smart-academy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: smart_academy
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
