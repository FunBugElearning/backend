version: "3.8"

services:
  db:
    image: postgres:16
    container_name: funbug-db
    restart: always
    environment:
      POSTGRES_DB: funbugdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kienvu123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: funbug-backend
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/funbugdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: kienvu123
    ports:
      - "8080:8080"

volumes:
  postgres_data: